<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E3A31">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mona Lisa">
<title>Villa Mona Lisa · Marrakech</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
@font-face{font-family:'Italiana';src:url(italiana-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Manrope';src:url(manrope-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Manrope';src:url(manrope-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Manrope';src:url(manrope-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Kufi';src:url(noto-kufi-arabic-arabic-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Kufi';src:url(noto-kufi-arabic-arabic-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
:root{
  --jardin:#1E3A31;--jardin2:#2B4C40;--sable:#F4EBDD;--sable2:#EADCC6;--carte:#FFFBF4;--encre:#24211C;--doux:#7B6F62;
  --terre:#B4552D;--or:#B8935A;--or2:#D9B87F;--ligne:#E3D3BC;
  --f-t:'Italiana',Georgia,serif;--f-b:'Manrope',system-ui,sans-serif;--r:22px;
  --safe-b:env(safe-area-inset-bottom)
}
[dir=rtl]{--f-t:'Kufi',serif;--f-b:'Kufi',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--sable);color:var(--encre);font:400 16px/1.55 var(--f-b);min-height:100vh;overscroll-behavior-y:none}
[dir=rtl] body{line-height:1.8}
h1,h2,h3{font-family:var(--f-t);font-weight:400;margin:0;line-height:1.1;letter-spacing:.01em}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{font-weight:600;letter-spacing:0;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + var(--safe-b));position:relative}
/* En-tête illustré */
.hero{position:relative;background:var(--jardin);color:#F6EEDF;padding:calc(18px + env(safe-area-inset-top)) 20px 0;overflow:hidden;border-radius:0 0 32px 32px}
.hero .top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.logo{font:400 15px var(--f-b);letter-spacing:.32em;text-transform:uppercase;color:var(--or2)}
[dir=rtl] .logo{letter-spacing:0;font-size:16px}
.lang{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:999px;padding:4px}
.lang button{border:0;background:none;color:#E8DCC8;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:999px;min-width:38px}
.lang button.on{background:var(--or);color:var(--jardin)}
.scene{position:relative;height:250px;margin:6px -20px 0}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.hero .txt{position:absolute;inset-inline-start:24px;bottom:34px;z-index:2;max-width:56%}
[dir=rtl] .scene svg{transform:scaleX(-1)}
.hero .txt p{margin:0 0 4px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--or2)}
[dir=rtl] .hero .txt p{letter-spacing:0;font-size:15px}
.hero h1{font-size:42px;color:#FFF8EC;overflow-wrap:break-word}
.hero .sub{margin-top:6px;font-size:15px;color:#D7CBB6}
main{padding:0 18px}
.sec{margin-top:26px}
.sec>h2{font-size:30px;margin:0 0 14px}
.label{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--doux);font-weight:600;margin:0 0 10px}
[dir=rtl] .label{letter-spacing:0;font-size:13px}
.card{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);padding:18px}
/* Séjour */
.stay{margin-top:-28px;position:relative;z-index:3;display:grid;gap:14px}
.stay .row{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}
.stay b{font:400 30px/1 var(--f-t)}
[dir=rtl] .stay b{font-weight:600;font-size:24px}
.prog{height:6px;border-radius:6px;background:var(--sable2);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--terre));border-radius:6px}
.muted{color:var(--doux)}
.small{font-size:13.5px}
/* Raccourcis */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{color:inherit;text-decoration:none;background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);padding:16px;display:grid;gap:8px;text-align:start;min-height:118px;align-content:start}
.tile .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--sable)}
.tile .ic svg{width:22px;height:22px;color:var(--jardin)}
.tile b{font-weight:600;font-size:15px}.tile span{font-size:13.5px;color:var(--doux);overflow-wrap:anywhere}
.tile.dark{background:var(--jardin);border-color:var(--jardin);color:#F6EEDF}.tile.dark span{color:#C9BDA7}.tile.dark .ic{background:rgba(255,255,255,.1)}.tile.dark .ic svg{color:var(--or2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;border:0;background:var(--jardin);color:#FFF8EC;font-weight:600;font-size:15.5px;text-decoration:none;width:100%}
.btn.or{background:var(--or);color:var(--jardin)}.btn.terre{background:var(--terre);color:#fff}
.btn.ghost{background:transparent;color:var(--jardin);border:1.5px solid var(--jardin)}
.btn svg{width:20px;height:20px}
.btn.small{min-height:40px;padding:0 16px;font-size:14px;width:auto}
/* Services */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -18px;padding-inline:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--ligne);background:var(--carte);border-radius:999px;padding:9px 16px;font-weight:500;font-size:14px}
.chips button.on{background:var(--jardin);color:#FFF8EC;border-color:var(--jardin)}
.svc{display:grid;grid-template-columns:56px 1fr;gap:14px;background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);padding:16px;text-align:start;width:100%;margin-bottom:12px}
.svc .ic{width:56px;height:56px;border-radius:18px;background:linear-gradient(145deg,var(--sable),var(--sable2));display:grid;place-items:center}
.svc .ic svg{width:28px;height:28px;color:var(--terre)}
.svc h3{font-family:var(--f-b);font-size:16px;font-weight:600;line-height:1.3}
.svc p{margin:4px 0 8px;font-size:14px;color:var(--doux)}
.price{font-weight:600;color:var(--jardin)}.price small{font-weight:400;color:var(--doux)}
/* Feuille (bottom sheet) */
.veil{position:fixed;inset:0;background:rgba(20,28,24,.5);z-index:40;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--sable);border-radius:28px 28px 0 0;max-height:92vh;overflow:auto;padding:10px 20px calc(24px + var(--safe-b));max-width:560px;margin:0 auto;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grip{width:44px;height:5px;border-radius:5px;background:var(--ligne);margin:0 auto 14px}
.sheet h2{font-size:30px;margin-bottom:6px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.form{display:grid;gap:14px;margin:18px 0}
.form label{display:grid;gap:6px;font-size:13.5px;color:var(--doux);font-weight:500}
.form input,.form textarea{min-height:52px;border:1px solid var(--ligne);background:var(--carte);border-radius:16px;padding:12px 16px;width:100%}
.form textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--carte);border:1px solid var(--ligne);border-radius:16px;padding:6px}
.step button{width:42px;height:42px;border-radius:12px;border:0;background:var(--sable);font-size:22px;color:var(--jardin)}
.step b{font-size:18px}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 16px}
.tot b{font:400 34px var(--f-t);color:var(--jardin)}
[dir=rtl] .tot b{font-weight:600;font-size:26px}
/* Barre du bas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,251,244,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--ligne);padding:8px 8px calc(8px + var(--safe-b))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--doux);padding:6px 0;position:relative}
[dir=rtl] .tabs button{font-size:12px}
.tabs svg{width:24px;height:24px}
.tabs button.on{color:var(--jardin)}.tabs button.on svg{color:var(--terre)}
.tabs .badge{position:absolute;top:0;inset-inline-end:22%;background:var(--terre);color:#fff;border-radius:999px;font-size:10.5px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
/* Listes */
.list{display:grid;gap:10px}
.li{display:flex;gap:14px;align-items:flex-start;background:var(--carte);border:1px solid var(--ligne);border-radius:18px;padding:14px 16px}
.li .ic{flex:none;width:44px;height:44px;border-radius:14px;background:var(--sable);display:grid;place-items:center}.li .ic svg{width:22px;height:22px;color:var(--jardin)}
.li b{display:block;font-weight:600;font-size:15px}.li p{margin:2px 0 0;font-size:14px;color:var(--doux)}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.rules li{display:flex;gap:12px;font-size:15px}.rules li::before{content:"";flex:none;width:8px;height:8px;margin-top:9px;transform:rotate(45deg);background:var(--or)}
details.acc{background:var(--carte);border:1px solid var(--ligne);border-radius:18px;margin-bottom:10px}
details.acc summary{list-style:none;padding:16px 18px;font-weight:600;display:flex;justify-content:space-between;cursor:pointer}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font-weight:400;color:var(--or);font-size:22px;line-height:1}
details.acc[open] summary::after{content:"–"}
details.acc p{margin:0;padding:0 18px 16px;color:var(--doux);font-size:14.5px}
.ur{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--ligne)}.ur:last-child{border:0}
.ur a{color:var(--terre);font-weight:600;text-decoration:none;white-space:nowrap}
/* Guide */
.spot{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.spot .vis{height:120px;background:linear-gradient(135deg,var(--terre),var(--or));position:relative}
.spot .vis svg{position:absolute;inset:0;width:100%;height:100%;opacity:.35}
.spot .vis span{position:absolute;bottom:12px;inset-inline-start:16px;background:rgba(255,251,244,.92);color:var(--jardin);font-size:12px;font-weight:600;border-radius:999px;padding:4px 12px}
.spot .bd{padding:16px}.spot h3{font-size:26px}.spot p{margin:6px 0 14px;color:var(--doux);font-size:14.5px}
.spot .row{display:flex;gap:10px}
/* Réservations */
.resa{display:grid;grid-template-columns:1fr auto;gap:6px;background:var(--carte);border:1px solid var(--ligne);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.resa b{font-weight:600}.ok{display:inline-flex;align-items:center;gap:6px;color:#2F7A55;font-size:13px;font-weight:600}
.ok::before{content:"";width:8px;height:8px;border-radius:50%;background:#2F7A55}
.toast{white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + var(--safe-b));background:var(--jardin);color:#FFF8EC;padding:12px 20px;border-radius:999px;z-index:60;font-size:14.5px;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:fade .2s}
.demo{margin:28px 0 0;text-align:center;font-size:12px;color:var(--doux)}
.sheet .cart-li{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--ligne)}
.sheet .cart-li button{border:0;background:none;color:var(--terre);font-size:13px;font-weight:600}
.paybox{background:var(--carte);border:1px solid var(--ligne);border-radius:18px;padding:16px;margin:14px 0;display:grid;gap:8px}
.paybox .sec-row{display:flex;align-items:center;gap:8px;color:var(--doux);font-size:13px}
.paybox .sec-row svg{width:16px;height:16px;color:var(--jardin)}
.check{width:84px;height:84px;border-radius:50%;background:var(--jardin);display:grid;place-items:center;margin:16px auto}
.check svg{width:40px;height:40px;color:var(--or2)}
.center{text-align:center}
.avatar{flex:none;width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,var(--or),var(--terre));color:#FFF8EC;display:grid;place-items:center;font:400 22px var(--f-t)}
.mot{background:linear-gradient(160deg,var(--carte),#F8EFE1)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--jardin);border-radius:var(--r);padding:16px 8px;color:#F6EEDF;text-align:center}
.facts b{display:block;font:400 24px var(--f-t);color:var(--or2)}.facts span{font-size:12px;color:#C9BDA7}
[dir=rtl] .facts b{font-weight:600;font-size:20px}
.gal{display:grid;grid-auto-flow:column;grid-auto-columns:78%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:0 18px 6px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal figure{margin:0;scroll-snap-align:start;border-radius:var(--r);overflow:hidden;position:relative;aspect-ratio:16/10;background:var(--sable2)}
.gal svg{width:100%;height:100%;display:block}
.gal figcaption{position:absolute;inset-inline-start:12px;bottom:12px;background:rgba(255,251,244,.92);color:var(--jardin);font-size:13px;font-weight:600;border-radius:999px;padding:5px 12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs"></nav>
<script src="data.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
